name: Format step 5 files (temporary)
on:
  push:
    branches: [feat/site-information-architecture-step-5]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx prettier --write apps/site/app/collaboration/page.tsx apps/site/app/page.tsx tests/site/site.spec.ts
      - name: Commit formatting
        run: |
          if git diff --quiet -- apps/site/app/collaboration/page.tsx apps/site/app/page.tsx tests/site/site.spec.ts; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/site/app/collaboration/page.tsx apps/site/app/page.tsx tests/site/site.spec.ts
          git commit -m "style(site): format Figma route templates and tests"
          git push origin HEAD:feat/site-information-architecture-step-5

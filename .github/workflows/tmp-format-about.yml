name: Temporary format about-page changes
on:
  push:
    branches: [feat/about-team-stories-violet-frames]
    paths:
      - .github/workflows/tmp-format-about.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/about-team-stories-violet-frames
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Format modified files and push
        run: |
          npx prettier --write apps/site/app/about/page.tsx apps/site/app/about/about.module.css apps/site/app/games/games.module.css
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/site/app/about/page.tsx apps/site/app/about/about.module.css apps/site/app/games/games.module.css
          git diff --cached --quiet || git commit -m "Format about-page and game-card changes"
          git push

name: Temporary About formatting
on:
  push:
    branches:
      - feat/about-team-photos-gifs-glitch
    paths:
      - .github/workflows/format-about-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/about-team-photos-gifs-glitch
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx prettier --write apps/site/app/about/about.module.css apps/site/app/about/page.tsx
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/site/app/about/about.module.css apps/site/app/about/page.tsx
          if ! git diff --cached --quiet; then
            git commit -m "style: apply prettier to about page"
            git push origin HEAD:feat/about-team-photos-gifs-glitch
          fi

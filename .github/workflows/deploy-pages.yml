name: Deploy Edem Website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Publish only the newest commit. GitHub Pages keeps the previous deployment
# live until the replacement deployment succeeds.
concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EDEM_SITE_REVISION: ${{ github.sha }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting and types
        run: |
          npm run format:check
          npm run typecheck

      - name: Build UI library and website
        run: npm run build:site

      - name: Verify static export
        run: |
          test -s apps/site/out/index.html
          test -s apps/site/out/games/index.html
          test -s apps/site/out/games/kazino-mefisa/index.html
          test -s apps/site/out/games/parad-tehnologiy/index.html
          test -s apps/site/out/images/games/parad-tehnologiy/0073.webp
          test -s apps/site/out/images/games/parad-tehnologiy/0205-thumb.webp
          test -s apps/site/out/images/games/kazino-mefisa/0100-thumb.webp
          node scripts/verify-gallery-manifests.mjs

      - name: Disable Jekyll
        run: touch apps/site/out/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/site/out

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4

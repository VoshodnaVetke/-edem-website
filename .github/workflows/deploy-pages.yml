name: Deploy Edem Website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EDEM_SITE_REVISION: ${{ github.sha }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build UI library and website
        run: npm run build:site

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify static export
        run: npm run test:site

      - name: Disable Jekyll
        run: touch apps/site/out/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/site/out

      - name: Wait for the Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..12}; do
            if artifact_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=github-pages" \
              --jq '.artifacts[] | select(.expired == false) | .id') && [ -n "$artifact_id" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::The github-pages artifact is still unavailable."
          exit 1

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify published website
        env:
          EDEM_SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          test -n "$EDEM_SITE_URL"
          npm run test:site

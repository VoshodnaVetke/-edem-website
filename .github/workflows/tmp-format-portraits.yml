name: Temporary format portrait changes
on:
  push:
    branches: [fix/about-portrait-clipping-and-autoplay]
    paths: [.github/workflows/tmp-format-portraits.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/about-portrait-clipping-and-autoplay
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Format touched source and tests
        run: |
          npx prettier --write apps/site/app/about/page.tsx apps/site/app/about/about.module.css apps/site/app/about/GameFormats.tsx tests/site/site.spec.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/site/app/about/page.tsx apps/site/app/about/about.module.css apps/site/app/about/GameFormats.tsx tests/site/site.spec.ts
          git diff --cached --quiet || git commit -m "Format portrait changes"
          git push

name: Temporary portrait CSS formatter
on:
  push:
    branches: [fix/team-portrait-media-crop]
    paths: [.github/workflows/tmp-format-portraits-75.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/team-portrait-media-crop
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply Prettier and push
        run: |
          npx prettier --write apps/site/app/about/about.module.css
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/site/app/about/about.module.css
          git diff --cached --quiet || git commit -m "Format portrait frame CSS"
          git push

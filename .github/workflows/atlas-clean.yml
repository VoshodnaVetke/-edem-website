name: Atlas cleanup checks
on:
  pull_request:
    paths:
      - 'design-system/prototypes/components/atlas-clean/**'
      - 'design-system/reference/component-atlas-v10.4.html'
      - 'tests/design-system/**'
      - '.github/workflows/atlas-clean.yml'
  push:
    branches: [main]
    paths:
      - 'design-system/prototypes/components/atlas-clean/**'
      - 'design-system/reference/component-atlas-v10.4.html'
      - 'tests/design-system/**'
      - '.github/workflows/atlas-clean.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tests/design-system/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Compare CSS and exercise the real catalog
        run: |
          CHROMIUM_PATH="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          python tests/design-system/check_css.py --chromium "$CHROMIUM_PATH"
          python tests/design-system/check_navigation.py --chromium "$CHROMIUM_PATH"
          python tests/design-system/check_runtime.py --chromium "$CHROMIUM_PATH"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-check-results
          path: work/atlas-check/

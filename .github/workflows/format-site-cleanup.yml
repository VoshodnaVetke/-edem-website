name: Format site cleanup (temporary)
on:
  push:
    branches: [chore/remove-site-demos]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx prettier --write tests/site/site.spec.ts
      - name: Commit formatted test
        run: |
          if git diff --quiet -- tests/site/site.spec.ts; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/site/site.spec.ts
          git commit -m "style(site): format real-site test coverage"
          git push origin HEAD:chore/remove-site-demos
